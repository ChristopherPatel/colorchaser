<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Color Chaser is a colorful learning and reaction game for children.">

    <title>Color Chaser</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #17324d;
            background:
                linear-gradient(
                    180deg,
                    #71cfff 0%,
                    #dff6ff 55%,
                    #73c85c 100%
                );
        }

        main {
            width: 100%;
            max-width: 650px;
            padding: 48px 30px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0 0 20px;
            font-size: clamp(3rem, 10vw, 5rem);
            color: #1268aa;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 22px;
            padding: 14px 26px;
            border-radius: 999px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background: #449c3f;
        }
    </style>
</head>

<body>
    <main>
        <h1>Color Chaser</h1>

        <p>
            A colorful learning and reaction game designed
            especially for children.
        </p>

        <p>
            Color Chaser will soon be available on Google Play.
        </p>

        <div class="status">
            Coming soon
        </div>
    </main>
</body>
</html>
